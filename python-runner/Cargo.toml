[package]
name = "python-runner"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
rustpython-vm = { version = "0.4.0", default-features = false, features = ["compiler", "codegen"] }
rustpython-stdlib = { version = "0.4.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
