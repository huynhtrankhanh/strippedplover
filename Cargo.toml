[package]
name = "rust-strippedplover"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31.0", features = ["bundled"] }
# Remove rustpython from host
wasmtime = "21.0.1" # Latest wasmtime
wasi-common = "21.0.1"
thiserror = "1.0"
anyhow = "1.0"
regex = "1.10"
lazy_static = "1.4"
tokio = { version = "1.0", features = ["full"] }
